<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Value Investor{% endblock %}</title>
  <script>
    try {
      const saved = localStorage.getItem("theme");
      if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/static/style.css?v={{ asset_version }}">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-row">
      <a class="brand" href="/">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <rect width="24" height="24" rx="7" fill="currentColor"/>
          <path d="M6 15.5l3.6-3.6 2.8 2.8L18 9" fill="none" style="stroke: var(--surface)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="brand-name">Value Investor</span>
      </a>
      <nav class="tabs">
        <a href="/" {% if request.url.path == '/' or request.url.path.startswith('/company') %}aria-current="page"{% endif %}>Ranking</a>
        <a href="/market" {% if request.url.path == '/market' %}aria-current="page"{% endif %}>Markets</a>
        <a href="/portfolio" {% if request.url.path == '/portfolio' %}aria-current="page"{% endif %}>Portfolio</a>
        <a href="/track" {% if request.url.path == '/track' %}aria-current="page"{% endif %}>Track record</a>
      </nav>
      <button class="icon-button theme-toggle" type="button" aria-label="Switch to dark theme">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
      </button>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="wrap footer">
    SEC EDGAR, Yahoo Finance, FRED, World Bank. Computed, not advice.
  </footer>
  <div class="tooltip" role="status" hidden></div>
  <script src="/static/theme.js?v={{ asset_version }}" defer></script>
  <script src="/static/charts.js?v={{ asset_version }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
